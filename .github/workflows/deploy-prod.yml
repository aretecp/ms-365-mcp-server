name: Deploy Production

# Thin shim over the shared VPS deploy workflow (see deploy-dev.yml). App runtime
# config is the /m365-mcp Infisical folder (prod env) — add a secret there and it
# lands in .env on the next deploy, no edit here.
#
# allow-clone is false: prod refuses to clone. A missing checkout on the VPS is a
# human-intervention situation, not an automated recovery.

on:
  release:
    types: [published]
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to deploy (e.g. v1.2.3). Defaults to the triggering ref."
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: aretecp/github-actions/.github/workflows/deploy-vps-shared.yml@v2
    with:
      environment: production
      infisical-identity-id: ${{ vars.INFISICAL_OIDC_IDENTITY_ID }}
      shared-project-slug: ${{ vars.INFISICAL_SHARED_PROJECT_SLUG }}
      app-project-slug: ${{ vars.INFISICAL_INTERNAL_PROJECT_SLUG }}
      env-slug: prod
      app-path: /m365-mcp
      infra-path: /tailscale
      vps-user: ${{ vars.VPS_USER }}
      repo-dir: /home/${{ vars.VPS_USER }}/ms-365-mcp-server
      repo-url: https://github.com/aretecp/ms-365-mcp-server.git
      compose-file: docker-compose.prod.yml
      env-file-name: .env
      ref: ${{ inputs.version || github.ref_name }}
      allow-clone: false
      healthcheck-containers: m365_mcp
      required-keys: MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET MICROSOFT_TENANT_ID MS365_MCP_SESSION_KEY PUBLIC_HOSTNAME
