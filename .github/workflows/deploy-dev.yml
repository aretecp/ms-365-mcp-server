name: Deploy Dev

# Thin shim over the shared VPS deploy workflow. App runtime config is the
# /m365-mcp Infisical folder (dev env) — add a secret there and it lands in
# .env.dev on the next deploy, no edit here.
#
# Replaces a hand-rolled workflow that loaded shared secrets from the ROOT of
# arete-shared with recursive: true. The shared workflow reads only
# `infra-path` (/tailscale) for deploy credentials, which is the same folder
# every other consumer repo uses.

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "develop"

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: aretecp/github-actions/.github/workflows/deploy-vps-shared.yml@v2
    with:
      environment: development
      infisical-identity-id: ${{ vars.INFISICAL_OIDC_IDENTITY_ID }}
      shared-project-slug: ${{ vars.INFISICAL_SHARED_PROJECT_SLUG }}
      app-project-slug: ${{ vars.INFISICAL_INTERNAL_PROJECT_SLUG }}
      env-slug: dev
      app-path: /m365-mcp
      infra-path: /tailscale
      vps-user: ${{ vars.VPS_USER }}
      repo-dir: /home/${{ vars.VPS_USER }}/ms-365-mcp-server
      repo-url: https://github.com/aretecp/ms-365-mcp-server.git
      compose-file: docker-compose.dev.yml
      env-file-name: .env.dev
      ref: ${{ inputs.branch || github.ref_name }}
      allow-clone: true
      healthcheck-containers: m365_mcp_dev
      required-keys: MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET MICROSOFT_TENANT_ID MS365_MCP_SESSION_KEY PUBLIC_HOSTNAME
